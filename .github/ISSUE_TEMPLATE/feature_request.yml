name: Feature request
description: Suggest a new tool or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the solution. What is painful today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like DocMax to do?
      description: A sketch of the command and its output is perfect.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to try implementing this
